<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset library · Snipio</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/snipio-32.png">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="reset-library.css">
  <script src="../lib/core.js" defer></script>
  <script src="../lib/examples.js" defer></script>
  <script src="../lib/example-library.js" defer></script>
  <script src="reset-library.js" defer></script>
</head>
<body class="reset-page">
  <main class="reset-card">
    <img src="../assets/icons/snipio-logo.svg" width="72" height="72" alt="">
    <p class="eyebrow">SNIPIO</p>
    <h1>Restore your starter templates.</h1>
    <p>Reset the built-in snippets in Getting started, including edited or deleted templates. Your own snippets and usage history are kept.</p>
    <button id="reset-library" class="primary-button" type="button">Reset initial templates</button>
    <p id="reset-status" role="status" aria-live="polite"></p>
    <button id="open-snipio" class="primary-button" type="button" hidden>Open Snipio</button>
  </main>
</body>
</html>
